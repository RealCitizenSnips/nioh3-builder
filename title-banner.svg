<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e0a6"/>
      <stop offset="45%" stop-color="#e8c56a"/>
      <stop offset="100%" stop-color="#b8862d"/>
    </linearGradient>
    <filter id="ember" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feFlood flood-color="#8a1212" flood-opacity=".55"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <text x="400" y="118" text-anchor="middle" fill="url(#gold)" filter="url(#ember)"
        font-family="Palatino, Georgia, serif" font-size="92" font-weight="700"
        letter-spacing="4">NIOH 3</text>
  <text x="400" y="188" text-anchor="middle" fill="url(#gold)" filter="url(#ember)"
        font-family="Palatino, Georgia, serif" font-size="36" font-weight="700"
        letter-spacing="8">EQUIPMENT BUILDER</text>
</svg>
