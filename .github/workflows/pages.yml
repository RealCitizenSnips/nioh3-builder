name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI patch
        run: python3 scripts/patch_pages.py
      - name: Verify banner + builder
        run: |
          test -f index.html
          test -f title-banner.png
          grep -q "v0.9.5" index.html
          grep -q "title-banner.png" index.html
          grep -q "Reset All" index.html
          ! grep -q "title-banner.svg" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
