name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch builder chrome
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text()
          for old in ['href="icon.svg"','href="icon-v3.svg"','href="icon-brushed.svg"']:
              t = t.replace(old, 'href="icon-180.png?v=082"')
          css = '.hero{margin:0 0 14px;padding:22px 14px 18px;text-align:center;border-radius:16px;background:radial-gradient(ellipse at 50% 85%,rgba(170,18,18,.55),transparent 62%),linear-gradient(180deg,#160808 0%,#070707 100%);border:1px solid rgba(212,168,80,.28);box-shadow:inset 0 -24px 40px rgba(40,0,0,.35)}.hero h1{margin:0;font-size:1.28rem;font-weight:700;letter-spacing:.06em;color:#e8c56a;text-shadow:0 0 16px rgba(160,20,20,.5);text-align:center}.hero .ver{display:block;margin-top:6px;font-size:.72rem;font-weight:600;letter-spacing:.14em;color:#c4a050;text-transform:uppercase}\n'
          if '.hero{' not in t:
              t = t.replace('h1{font-size:1.45rem;font-weight:700;letter-spacing:-.03em;margin:0 0 12px}', css + 'h1{font-size:1.45rem;font-weight:700;letter-spacing:-.03em;margin:0 0 12px}', 1)
          t = t.replace('<h1>Nioh 3 Equipment Builder <span class="ver">v0.8.1</span></h1>', '<header class="hero"><h1>Nioh 3 Equipment Builder</h1><span class="ver">v0.8.2</span></header>')
          p.write_text(t)
          print('ok', 'icon-180' in t, 'hero' in t)
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
