name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Paint transparent banner PNG
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/make_banner.py
      - name: Write missing icon placeholders
        run: python3 scripts/make_icons.py
      - name: Compose overlay if overlay_v010.js is missing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ov = Path("scripts/overlay_v010.js")
          logic = Path("scripts/overlay_logic.js")
          level = Path("scripts/level_table.json")
          truth = Path("scripts/sheet_truth.json")
          startp = Path("scripts/start_defaults.json")
          if ov.exists() and "n3val" in ov.read_text(encoding="utf-8"):
              print("overlay_v010.js present")
          else:
              missing = [str(p) for p in (logic, level, truth) if not p.exists()]
              if missing:
                  raise SystemExit("cannot compose overlay, missing " + ", ".join(missing))
              start = startp.read_text(encoding="utf-8").strip() if startp.exists() else "{}"
              text = (
                  "const N3_LEVEL = " + level.read_text(encoding="utf-8").strip() + ";\n"
                  "const N3_TRUTH = " + truth.read_text(encoding="utf-8").strip() + ";\n"
                  "const N3_START = " + start + ";\n"
                  + logic.read_text(encoding="utf-8")
              )
              if "n3val" not in text:
                  raise SystemExit("composed overlay missing n3val")
              ov.write_text(text, encoding="utf-8")
              print("composed overlay_v010.js", ov.stat().st_size)
          PY
      - name: Apply UI patch
        run: python3 scripts/patch_pages.py
      - name: Verify banner + builder
        run: |
          fail=0
          check() { if eval "$1"; then echo "OK  $2"; else echo "FAIL $2"; fail=1; fi; }
          check 'test -f index.html' 'index.html exists'
          check 'test -f title-banner.png' 'title-banner.png written'
          check 'test -f tune.css' 'tune.css exists'
          check 'python3 -c "p=open(\"title-banner.png\",\"rb\").read(); assert p[:8]==b\"\\x89PNG\\r\\n\\x1a\\n\" and len(p)>8000"' 'banner is a real PNG >8KB'
          check 'test -f icons/placeholder.svg' 'placeholder icon exists'
          check 'grep -q "v0.12.0" index.html' 'version v0.12.0'
          check 'grep -q "title-banner.png?v=012" index.html' 'html points at PNG banner'
          check 'grep -q "tune.css?v=012" index.html' 'tune.css linked'
          check 'grep -q "Reset All" index.html' 'Reset All label'
          check 'grep -q cruOnly=false index.html' 'Reset All clears weapon filters'
          check 'grep -q "Switching Style will clear all Equipment" index.html' 'style-switch copy'
          check '! grep -q "Empty all gear" index.html' 'old Empty all gear gone'
          check 'grep -q loadout-bar index.html' 'loadout bar above stats'
          check '! grep -q btn-levels index.html' 'Levels button gone'
          check '! grep -q char-drawer index.html' 'Character Level drawer gone'
          check '! grep -q "<h2>Character Level</h2>" index.html' 'Character Level heading gone'
          check 'python3 -c "h=open(\"index.html\").read(); hero=h.split(\"<header\",1)[1].split(\"</header>\",1)[0]; assert \"brush-title\" not in hero and \"NIOH 3\" not in hero and \"title-banner.png\" in hero"' 'hero is PNG only, no title text'
          check 'grep -q -- "--n3-h2" index.html' 'tunable heading size'
          check 'grep -q "Moonprayer Gauntlets" index.html' 'Moonprayer arms in catalog overlay'
          if [ "$fail" -ne 0 ]; then echo "verify failed"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
